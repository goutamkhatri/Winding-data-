<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Bhagwati Electrical - Register</title>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --g: #27ae60; --r: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f3f5; margin: 0; padding-bottom: 90px; }
        header { background: var(--p); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .container { padding: 12px; }

        /* Clean List Style */
        .list-item { background: white; padding: 15px; margin-bottom: 8px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--s); cursor: pointer; }
        .list-item span { font-weight: bold; color: var(--p); font-size: 16px; }
        .list-item small { color: #888; font-size: 11px; }
        
        /* Details Section (Accordion) */
        .details { display: none; background: #fff; padding: 15px; border-radius: 0 0 10px 10px; border: 1px solid #e0e0e0; border-top: none; margin-top: -10px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        .data-box { background: #f8f9fa; padding: 8px; border-radius: 5px; text-align: center; border: 1px solid #eee; }
        .label { font-size: 10px; color: #888; display: block; text-transform: uppercase; font-weight: bold; }
        .val { font-size: 13px; font-weight: bold; color: #333; }

        .section-h { background: #eef2f7; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; margin: 10px 0; color: var(--p); border-left: 3px solid var(--s); }

        /* Image Gallery */
        .img-grid { display: flex; overflow-x: auto; gap: 10px; margin-top: 10px; padding-bottom: 5px; }
        .img-grid img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; flex-shrink: 0; }

        /* Form / Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; overflow-y: auto; }
        .form-container { padding: 20px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .row { display: flex; gap: 10px; }
        
        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--g); color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 35px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 200; outline: none; }
        .save-btn { background: var(--g); color: white; padding: 15px; border: none; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 10px; }
        .action-btn { border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">Maa Bhagwati Electrical</h2>
    <small>स्मार्ट वाइंडिंग रजिस्टर</small>
</header>

<div class="container">
    <input type="text" id="search" placeholder="मोटर का नाम सर्च करें..." onkeyup="render()" style="width:100%; padding:15px; border-radius:30px; border:1px solid #ddd; margin-bottom:20px; outline:none; font-size:16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <div id="list"></div>
</div>

<button class="fab" onclick="openForm()">+</button>

<div id="modal">
    <div class="form-container">
        <h2 id="ftitle">नई वाइंडिंग एंट्री</h2>
        <input type="hidden" id="eid">
        
        <label style="font-weight:bold;">मोटर का नाम</label>
        <input type="text" id="name" placeholder="उदा: Texmo 1HP Crompton">
        
        <div class="section-h">स्टेटर साइज (Stator Size)</div>
        <div class="row">
            <input type="text" id="idSize" placeholder="I.D.">
            <input type="text" id="odSize" placeholder="O.D.">
            <input type="text" id="coreSize" placeholder="CORE Size">
        </div>

        <div class="section-h">रनिंग डेटा (Running Winding)</div>
        <div class="row">
            <input type="text" id="rGage" placeholder="SWG गेज">
            <input type="text" id="rTurn" placeholder="Turns टर्न">
            <input type="text" id="rLen" placeholder="Coil Size लंबाई">
        </div>

        <div class="section-h">स्टार्टिंग डेटा (Starting Winding)</div>
        <div class="row">
            <input type="text" id="sGage" placeholder="SWG गेज">
            <input type="text" id="sTurn" placeholder="Turns टर्न">
            <input type="text" id="sLen" placeholder="Coil Size लंबाई">
        </div>

        <div class="section-h">अन्य विवरण (Capacitor & Connection)</div>
        <div class="row">
            <input type="text" id="cap" placeholder="Capacitor MFD">
            <input type="text" id="conn" placeholder="Connection (Star/Delta/Series)">
        </div>

        <div class="section-h">फोटो अपलोड (अधिकतम 5)</div>
        <input type="file" id="picsInput" accept="image/*" multiple onchange="handlePics(this)">
        <div id="p-prev" class="img-grid"></div>

        <button class="save-btn" onclick="save()">सुरक्षित करें</button>
        <button onclick="closeForm()" style="width:100%; background:none; border:none; color:var(--r); margin-top:15px; font-weight:bold; font-size:16px;">वापस जाएँ</button>
    </div>
</div>

<script>
    // डेटाबेस लोड करना
    let db = JSON.parse(localStorage.getItem('mb_final_list_db')) || [];
    let tempPics = [];

    // क्लिक करने पर विवरण को खोलना या बंद करना (Accordion)
    function toggleDetails(id) {
        let el = document.getElementById('det-' + id);
        let allDetails = document.querySelectorAll('.details');
        
        // पुरानी खुली हुई डिटेल्स बंद करें ताकि स्क्रीन साफ़ रहे
        allDetails.forEach(d => { if(d.id !== 'det-'+id) d.style.display = 'none'; });
        
        // करंट विवरण को चालू/बंद करें
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    // बड़ी इमेज को कंप्रेस करके छोटा करने का फंक्शन (ताकि मेमोरी फुल न हो)
    function handlePics(input) {
        const files = input.files;
        if (files.length > 5) { alert("कृपया अधिकतम 5 फोटो ही चुनें!"); input.value = ""; return; }
        
        tempPics = []; 
        document.getElementById('p-prev').innerHTML = ""; 

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 500; // मोबाइल स्क्रीन के लिए पर्याप्त चौड़ाई
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6); // 60% क्वालिटी कंप्रेस
                    
                    tempPics.push(compressedBase64);
                    
                    // फॉर्म में तुरंत प्रीव्यू दिखाना
                    const previewImg = document.createElement('img');
                    previewImg.src = compressedBase64;
                    document.getElementById('p-prev').appendChild(previewImg);
                };
            };
            reader.readAsDataURL(file);
        });
    }

    // फॉर्म खोलना (नया और एडिट दोनों के लिए)
    function openForm(editId = null) {
        document.getElementById('modal').style.display = 'block';
        resetForm();
        if(editId) {
            let i = db.find(x => x.id == editId);
            document.getElementById('ftitle').innerText = "डेटा सुधारें (Edit)";
            document.getElementById('eid').value = i.id;
            document.getElementById('name').value = i.name;
            document.getElementById('idSize').value = i.idSize;
            document.getElementById('odSize').value = i.odSize;
            document.getElementById('coreSize').value = i.coreSize;
            document.getElementById('rGage').value = i.rGage;
            document.getElementById('rTurn').value = i.rTurn;
            document.getElementById('rLen').value = i.rLen;
            document.getElementById('sGage').value = i.sGage;
            document.getElementById('sTurn').value = i.sTurn;
            document.getElementById('sLen').value = i.sLen;
            document.getElementById('cap').value = i.cap;
            document.getElementById('conn').value = i.conn;
            tempPics = i.pics || [];
            tempPics.forEach(p => {
                const img = document.createElement('img');
                img.src = p;
                document.getElementById('p-prev').appendChild(img);
            });
        } else {
            document.getElementById('ftitle').innerText = "नई वाइंडिंग एंट्री";
        }
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }
    
    function resetForm() {
        document.getElementById('eid').value = '';
        document.querySelectorAll('.form-container input').forEach(i => { if(i.type != 'file') i.value = ''; });
        document.getElementById('picsInput').value = "";
        document.getElementById('p-prev').innerHTML = "";
        tempPics = [];
    }

    // डेटा सुरक्षित (Save) करना + Duplicate चेक
    function save() {
        let name = document.getElementById('name').value.trim();
        let core = document.getElementById('coreSize').value.trim();
        if(!name) { alert("मोटर का नाम लिखना जरूरी है!"); return; }
        
        let editId = document.getElementById('eid').value;

        // Duplicate Check: अगर नया डेटा है, तो चेक करें कि नाम और कोर साइज सेम तो नहीं है
        if(!editId) {
            let exists = db.some(x => x.name.toLowerCase() === name.toLowerCase() && x.coreSize === core);
            if(exists) { alert("यह मोटर और कोर साइज का डेटा पहले से सुरक्षित है!"); return; }
        }

        let data = {
            id: editId ? parseInt(editId) : Date.now(),
            name,
            idSize: document.getElementById('idSize').value,
            odSize: document.getElementById('odSize').value,
            coreSize: core,
            rGage: document.getElementById('rGage').value,
            rTurn: document.getElementById('rTurn').value,
            rLen: document.getElementById('rLen').value,
            sGage: document.getElementById('sGage').value,
            sTurn: document.getElementById('sTurn').value,
            sLen: document.getElementById('sLen').value,
            cap: document.getElementById('cap').value,
            conn: document.getElementById('conn').value,
            pics: tempPics,
            date: new Date().toLocaleDateString('hi-IN')
        };

        if(editId) {
            let idx = db.findIndex(x => x.id == editId);
            db[idx] = data;
        } else {
            db.push(data);
        }

        try {
            localStorage.setItem('mb_final_list_db', JSON.stringify(db));
            closeForm();
            render();
            alert("डेटा सफलतापूर्वक सुरक्षित हो गया!");
        } catch(e) {
            alert("मेमोरी फुल हो गई है! कृपया कुछ पुराना डेटा डिलीट करें।");
        }
    }

    // होम स्क्रीन पर केवल नाम की लिस्ट दिखाना
    function render() {
        let s = document.getElementById('search').value.toLowerCase();
        let list = document.getElementById('list');
        list.innerHTML = '';
        
        let filtered = db.filter(x => x.name.toLowerCase().includes(s));
        
        if(filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:gray; margin-top:20px;">कोई रिकॉर्ड नहीं मिला।</p>';
            return;
        }

        filtered.reverse().forEach(i => {
            let imgHtml = (i.pics || []).map(p => `<img src="${p}" onclick="window.open(this.src)">`).join('');
            
            list.innerHTML += `
            <div class="list-item" onclick="toggleDetails(${i.id})">
                <span>${i.name}</span>
                <small>तारीख: ${i.date}</small>
            </div>
            
            <div id="det-${i.id}" class="details">
                <div class="section-h">स्टेटर विवरण (Stator Measurements)</div>
                <div class="grid-3">
                    <div class="data-box"><span class="label">I.D.</span><span class="val">${i.idSize || '-'}</span></div>
                    <div class="data-box"><span class="label">O.D.</span><span class="val">${i.odSize || '-'}</span></div>
                    <div class="data-box"><span class="label">CORE</span><span class="val">${i.coreSize || '-'}</span></div>
                </div>
                
                <div class="section-h">रनिंग: SWG ${i.rGage || '-'} | Turns: ${i.rTurn || '-'} | Size: ${i.rLen || '-'}</div>
                <div class="section-h">स्टार्टिंग: SWG ${i.sGage || '-'} | Turns: ${i.sTurn || '-'} | Size: ${i.sLen || '-'}</div>
                
                <div class="grid-3" style="margin-top:10px;">
                    <div class="data-box" style="grid-column: span 2"><span class="label">CAPACITOR</span><span class="val">${i.cap || '-'} MFD</span></div>
                    <div class="data-box"><span class="label">CONNECTION</span><span class="val">${i.conn || '-'}</span></div>
                </div>
                
                <div class="img-grid">${imgHtml}</div>
                
                <div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px; display:flex; justify-content:space-between;">
                    <button class="action-btn" style="background:#eee; color:#333;" onclick="event.stopPropagation(); openForm(${i.id});">Edit</button>
                    <button class="action-btn" style="background:none; color:var(--r);" onclick="event.stopPropagation(); del(${i.id});">Delete</button>
                </div>
            </div>`;
        });
    }

    // डिलीट फंक्शन
    function del(id) {
        if(confirm('क्या आप सचमुच इस रिकॉर्ड को हटाना चाहते हैं?')) {
            db = db.filter(x => x.id != id);
            localStorage.setItem('mb_final_list_db', JSON.stringify(db));
            render();
        }
    }
    
    // पहली बार ऐप चालू होने पर लिस्ट दिखाना
    render();
</script>
</body>
</html>
                        <input type="text" id="rLength" placeholder="फरमा लंबाई" class="input-field">
                    </div>
                </div>

                <div class="bg-green-900/20 p-3 rounded-xl border border-green-500/30">
                    <p class="text-green-400 font-bold mb-2 uppercase text-[10px]">Starting Coil (स्टार्टिंग)</p>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="sSWG" placeholder="SWG" class="input-field">
                        <input type="text" id="sTurns" placeholder="Turns" class="input-field">
                        <input type="text" id="sWeight" placeholder="वजन (ग्राम)" class="input-field">
                        <input type="text" id="sLength" placeholder="फरमा लंबाई" class="input-field">
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeForm()" class="w-1/3 bg-slate-700 py-3 rounded-xl">कैंसिल</button>
                    <button type="submit" id="saveButton" class="w-2/3 bg-orange-500 py-3 rounded-xl font-bold">डेटा सेव करें</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="fixed inset-0 modal-bg hidden z-50 flex items-center justify-center p-4">
        <div id="detailsContent" class="bg-slate-800 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl relative min-h-[500px]">
            </div>
    </div>

    <script>
        let db;
        const request = indexedDB.open("MaaBhagawatiDB", 5);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("motors")) {
                db.createObjectStore("motors", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = (e) => { db = e.target.result; loadMotors(); };

        function openForm() { 
            document.getElementById('windingForm').reset(); 
            document.getElementById('editId').value = "";
            document.getElementById('modalTitle').innerText = "नया डेटा जोड़ें";
            document.getElementById('saveButton').innerText = "डेटा सेव करें";
            document.getElementById('entryModal').classList.remove('hidden'); 
        }

        function closeForm() { document.getElementById('entryModal').classList.add('hidden'); }

        document.getElementById('windingForm').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('photoInput').files[0];
            const editId = document.getElementById('editId').value;
            
            let base64 = "";
            if(file) {
                base64 = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            }

            const motorData = {
                name: document.getElementById('motorName').value,
                idSize: document.getElementById('idSize').value,
                odSize: document.getElementById('odSize').value,
                stamping: document.getElementById('stamping').value,
                slots: document.getElementById('slots').value,
                running: { 
                    swg: document.getElementById('rSWG').value, 
                    turns: document.getElementById('rTurns').value, 
                    weight: document.getElementById('rWeight').value, 
                    length: document.getElementById('rLength').value 
                },
                starting: { 
                    swg: document.getElementById('sSWG').value, 
                    turns: document.getElementById('sTurns').value, 
                    weight: document.getElementById('sWeight').value, 
                    length: document.getElementById('sLength').value 
                }
            };

            // If a new picture was uploaded, add it. If not and editing, keep old one (logic handled in transaction)
            if(base64) motorData.pic = base64;

            const tx = db.transaction("motors", "readwrite");
            const store = tx.objectStore("motors");

            if(editId) {
                motorData.id = parseInt(editId);
                // Get existing data first to preserve photo if no new photo uploaded
                store.get(motorData.id).onsuccess = (ev) => {
                    const existing = ev.target.result;
                    if(!base64 && existing.pic) motorData.pic = existing.pic;
                    store.put(motorData);
                };
            } else {
                store.add(motorData);
            }

            tx.oncomplete = () => {
                alert(editId ? "डेटा सफलतापूर्वक अपडेट हुआ!" : "डेटा सफलतापूर्वक अपलोड हुआ!");
                closeForm();
                loadMotors();
            };
        };

        function loadMotors() {
            const list = document.getElementById('motorList');
            list.innerHTML = "";
            const store = db.transaction("motors").objectStore("motors");
            store.openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if(cursor) {
                    const m = cursor.value;
                    list.innerHTML += `
                        <div class="card p-4 rounded-xl shadow-md flex justify-between items-center" onclick="showDetails(${m.id})">
                            <div>
                                <h3 class="font-bold text-orange-400 uppercase text-lg">${m.name}</h3>
                                <p class="text-xs text-slate-400 italic">स्लॉट: ${m.slots} | स्टांपिंग: ${m.stamping}</p>
                            </div>
                            <span class="text-slate-600 text-2xl">❯</span>
                        </div>`;
                    cursor.continue();
                }
            };
        }

        function showDetails(id) {
            db.transaction("motors").objectStore("motors").get(id).onsuccess = (e) => {
                const m = e.target.result;
                const details = document.getElementById('detailsContent');
                details.innerHTML = `
                    ${m.pic ? `<img src="${m.pic}" class="bg-pic">` : ''}
                    <div class="content-overlay">
                        <button onclick="closeDetails()" class="float-right text-white text-3xl">✕</button>
                        <h2 class="text-3xl font-bold text-orange-500 uppercase mt-4 mb-2">${m.name}</h2>
                        
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-black/60 p-3 rounded-xl border border-white/10">
                                <p class="text-[10px] text-slate-400 uppercase">Size (ID/OD)</p>
                                <p class="font-bold text-sm text-white">${m.idSize || '-'} / ${m.odSize || '-'}</p>
                            </div>
                            <div class="bg-black/60 p-3 rounded-xl border border-white/10">
                                <p class="text-[10px] text-slate-400 uppercase">Slots/Stamp</p>
                                <p class="font-bold text-sm text-white">${m.slots || '-'} / ${m.stamping || '-'}</p>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="bg-blue-600/20 p-4 rounded-xl border border-blue-400/30 shadow-xl">
                                <p class="font-bold text-blue-400 border-b border-blue-400/20 mb-2 uppercase text-xs">Running Data</p>
                                <div class="grid grid-cols-2 text-sm gap-y-1">
                                    <p class="text-slate-300">SWG: <b class="text-white">${m.running.swg}</b></p>
                                    <p class="text-slate-300">Turns: <b class="text-white">${m.running.turns}</b></p>
                                    <p class="text-slate-300">Weight: <b class="text-white">${m.running.weight}g</b></p>
                                    <p class="text-blue-200 font-bold">Length: <b>${m.running.length}</b></p>
                                </div>
                            </div>

                            <div class="bg-green-600/20 p-4 rounded-xl border border-green-400/30 shadow-xl">
                                <p class="font-bold text-green-400 border-b border-green-400/20 mb-2 uppercase text-xs">Starting Data</p>
                                <div class="grid grid-cols-2 text-sm gap-y-1">
                                    <p class="text-slate-300">SWG: <b class="text-white">${m.starting.swg}</b></p>
                                    <p class="text-slate-300">Turns: <b class="text-white">${m.starting.turns}</b></p>
                                    <p class="text-slate-300">Weight: <b class="text-white">${m.starting.weight}g</b></p>
                                    <p class="text-green-200 font-bold">Length: <b>${m.starting.length}</b></p>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-8">
                            <button onclick="editData(${m.id})" class="bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg">सुधारें (Edit)</button>
                            <button onclick="deleteData(${m.id})" class="bg-red-500/80 text-white font-bold py-3 rounded-lg shadow-lg">डिलीट</button>
                        </div>
                    </div>
                `;
                document.getElementById('detailsModal').classList.remove('hidden');
            };
        }

        function closeDetails() { document.getElementById('detailsModal').classList.add('hidden'); }

        function editData(id) {
            db.transaction("motors").objectStore("motors").get(id).onsuccess = (e) => {
                const m = e.target.result;
                document.getElementById('editId').value = m.id;
                document.getElementById('motorName').value = m.name;
                document.getElementById('idSize').value = m.idSize;
                document.getElementById('odSize').value = m.odSize;
                document.getElementById('stamping').value = m.stamping;
                document.getElementById('slots').value = m.slots;
                document.getElementById('rSWG').value = m.running.swg;
                document.getElementById('rTurns').value = m.running.turns;
                document.getElementById('rWeight').value = m.running.weight;
                document.getElementById('rLength').value = m.running.length;
                document.getElementById('sSWG').value = m.starting.swg;
                document.getElementById('sTurns').value = m.starting.turns;
                document.getElementById('sWeight').value = m.starting.weight;
                document.getElementById('sLength').value = m.starting.length;

                document.getElementById('modalTitle').innerText = "डेटा सुधारें";
                document.getElementById('saveButton').innerText = "अपडेट करें";
                
                closeDetails();
                document.getElementById('entryModal').classList.remove('hidden');
            };
        }

        function deleteData(id) {
            if(confirm("क्या आप वाकई इस डेटा को हटाना चाहते हैं?")) {
                db.transaction("motors", "readwrite").objectStore("motors").delete(id).onsuccess = () => {
                    closeDetails(); loadMotors();
                };
            }
        }

        function exportData() {
            db.transaction("motors").objectStore("motors").getAll().onsuccess = (e) => {
                const data = JSON.stringify(e.target.result);
                const blob = new Blob([data], {type: "application/json"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Winding_Backup_${new Date().toLocaleDateString()}.json`;
                a.click();
            };
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const tx = db.transaction("motors", "readwrite");
                    data.forEach(m => { delete m.id; tx.objectStore("motors").add(m); });
                    tx.oncomplete = () => { alert("पुराना बैकअप सफलता से लोड हो गया!"); loadMotors(); };
                } catch(err) { alert("गलत फाइल फॉर्मेट!"); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function searchMotor() {
            let f = document.getElementById('searchInput').value.toUpperCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = c.innerText.toUpperCase().includes(f) ? "" : "none";
            });
        }
    </script>
</body>
</html>
